services:
  db:
    image: postgres:17-alpine
    container_name: grammalab-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-grammalab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-grammalab}
      POSTGRES_DB: ${POSTGRES_DB:-grammalab}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - grammalab_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-grammalab} -d ${POSTGRES_DB:-grammalab}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  grammalab_pgdata:
